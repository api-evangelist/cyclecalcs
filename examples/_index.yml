description: >-
  CycleCalcs wires executable examples into its OpenAPI rather than
  hand-writing mocks: every 200 response carries a `live` example whose
  externalValue is a real, keyless, openable URL against the running API —
  "a real request to the running API, not a hand-written mock. It needs no key
  and can be opened directly, so the example is whatever the endpoint actually
  returns today." These files are those URLs, fetched and saved verbatim on
  the capture date, so the repo holds a concrete response body per marquee
  operation without inventing one. Re-fetch the `request` URL to refresh.
