overlay: 1.0.0
info:
  title: API Evangelist enhancements for the CycleCalcs Astronomy API
  version: 1.0.0
x-generated: '2026-08-09'
x-method: generated
x-source: >-
  Derived from openapi/cyclecalcs-astronomy-openapi-original.json (harvested
  verbatim from https://www.cyclecalcs.com/v2/openapi.json) plus the
  tool-to-endpoint table the provider publishes at
  https://www.cyclecalcs.com/api/mcp.html.
x-note: >-
  These are API Evangelist's enhancements, not provider claims. The harvested
  spec is already unusually complete — 29 operations, every one with a unique
  operationId, a summary, a description, a full 200/304/400/404/405/413/429
  response set, RFC 9457 problem schemas and live executable examples. The one
  material gap is tagging: the document declares no `tags` at all, so every
  operation is untagged. This overlay supplies the eight families the
  provider's own docs already group by, binds each MCP tool to its backing
  operation, and cross-links the artifacts in this repo. It never mutates the
  original.
extends: openapi/cyclecalcs-astronomy-openapi-original.json
actions:
  - target: $.info
    description: API Evangelist provenance and catalog cross-links.
    update:
      x-apievangelist-slug: cyclecalcs
      x-apievangelist-profile: https://apis.io/provider/cyclecalcs/
      x-apievangelist-enriched: '2026-08-09'
      x-artifact-conventions: conventions/cyclecalcs-conventions.yml
      x-artifact-errors: errors/cyclecalcs-problem-types.yml
      x-artifact-lifecycle: lifecycle/cyclecalcs-lifecycle.yml
      x-artifact-rate-limits: rate-limits/cyclecalcs-rate-limits.yml
      x-artifact-vocabulary: vocabulary/cyclecalcs-vocabulary.yml
      x-artifact-mcp: mcp/cyclecalcs-mcp.yml
  - target: $
    description: >-
      The published spec declares no top-level tags, so every operation is
      untagged and the reference renders as one flat list of 29 GETs. Declare
      the eight endpoint families the provider's own documentation already
      groups by.
    update:
      tags:
        - {name: Discovery, description: The API describing itself as data — routes, conventions, enums and the source register.}
        - {name: Sun, description: Solar day boundaries, twilight, the equation of time, and the seasons.}
        - {name: Moon, description: Phase, illumination, libration, nodes and apsides.}
        - {name: Planets, description: The visibility board, apparition events, retrograde stations and the Galilean moons.}
        - {name: Geometry, description: Positions, rise/transit/set, separations and conjunctions.}
        - {name: Time, description: Time scales, sidereal time and Julian dates.}
        - {name: Observing, description: Dark windows, sky quality, eclipses and the whole-sky snapshot.}
        - {name: Places, description: Place-name search and reverse lookup over the self-hosted GeoNames index.}
  - target: $.paths['/v2'].get
    description: Tag getDiscovery into the Discovery family.
    update:
      tags: [Discovery]
  - target: $.paths['/v2/conventions'].get
    description: Tag getConventions into the Discovery family.
