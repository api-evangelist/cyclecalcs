notes:
  frame_identifiers: >-
    The frame IDENTIFIERS eqj, eqd, ect, ecl, hor and gal are defined at /v2/conventions under frames. They are not accepted values of the frames parameter, which takes the frames_parameter set.
  rise_set_special: >-
    rise_set.special is nullable: the two codes in the rise_set_special set are the only non-null values, and null means neither polar condition applies.
  known_unreachable: >-
    On warning_codes and error_codes, known_unreachable true means this version cannot produce the code and names the surface it belongs to. False means it is not known to be unreachable, which is weaker than a promise that you can reach it.
  hemisphere: >-
    The hemisphere parameter selects the phase EMOJI only. It does not affect limb orientation: that comes from bright_limb.orientation_angle_deg, which is derived from the observer position and is already correct in either hemisphere.
attribution_register:
  source: https://www.cyclecalcs.com/v2/attribution
  verbatim: vocabulary/cyclecalcs-attribution.json
  description: >-
    A companion controlled register: every dataset behind every endpoint with
    its holder, version, role, licence, credit line and the obligation it puts
    on a caller. Records both `licence` and `license` spellings deliberately,
    because spec-00 fixes meta.engine.license while the GeoNames register
    entry is specified with `licence`.
