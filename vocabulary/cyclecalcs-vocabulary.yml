description: >-
  CycleCalcs publishes its controlled vocabulary as a live API endpoint —
  GET /v2/enums returns every enumerated value the API can emit or accept,
  each set scoped to the endpoints that use it. 40 sets in all,
  covering the body list, moon-phase names (northern and southern emoji
  variants), rise/set statuses, event kinds, zodiac signs, compass points,
  visibility phrases, the 74 warning codes, the 117 error codes, formats,
  frames, cache classes, rights states, the 21 tracked astronomical cycles
  and the explicit non-goals. Captured verbatim to
  vocabulary/cyclecalcs-enums.json.
