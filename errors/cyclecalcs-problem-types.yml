description: >-
  CycleCalcs publishes its error registry as data, generated from the same
  source (netlify/lib/v2/errors.mjs) as the human error reference, so the two
  cannot disagree. Every non-2xx v2 response is application/problem+json with
  a dereferenceable `type` URL pointing at the matching anchor on
  /api/errors.html — never about:blank. 117 codes are registered;
  87 are reachable from a live endpoint today and the remainder are
  reserved for surfaces that are specified but not yet shipped.
envelope:
  media_type: application/problem+json
  members: [type, title, status, detail, code, parameter, hint, example, supported, request_id, error_chain, docs]
  switch_on: code            # stable SCREAMING_SNAKE_CASE identifier
  request_id: >-
    16 lowercase hex characters on non-cacheable classes (429, 500, 503);
    null on every cacheable class, because a cached body cannot carry one
    caller's identifier to every later caller.
  retry_after: >-
    429 and 503 are the only two statuses that always carry an integer
    Retry-After.
extension_shapes:
  cap: >-
    { requested, minimum, maximum, unit }. minimum is omitted where the floor is zero or not meaningful.
  supported: >-
    array: the full list of values the named parameter accepts.
  unavailable: >-
    array of { name, reason }, one entry per target the API recognises the name of but will not compute.
  gap: >-
    { gap_start_local, gap_end_local, gap_seconds, instant_before_gap, instant_after_gap }, describing the spring-forward gap that swallowed the requested local time.
  candidates: >-
    array of { utc, utc_offset_seconds, utc_offset_iso, selected }, one entry per instant a repeated local time could mean.
statuses_used: [400, 401, 404, 405, 406, 409, 410, 413, 414, 422, 429, 500, 503]
