generated: '2026-08-09'
method: searched
status: published
source: https://www.cyclecalcs.com/api/mcp.html
description: >-
  CycleCalcs publishes a hosted, stateless Streamable HTTP MCP server that
  exposes eleven read-only astronomy tools, each backed by exactly one live
  /v2 REST endpoint. The server speaks MCP revision 2026-07-28 and the earlier
  2025 handshake revisions. `initialize` and `tools/list` are answered
  anonymously — the full eleven-tool manifest, with input AND output JSON
  Schemas, is readable without a key — and only `tools/call` requires one.
server:
  name: cyclecalcs
  transport: http           # Streamable HTTP, POST only, JSON responses
  url: https://www.cyclecalcs.com/mcp
  protocol_revisions:
    - '2026-07-28'
    - '2025 handshake revisions (backwards compatible)'
  stateless: true
  docs: https://www.cyclecalcs.com/api/mcp.html
authentication:
  browsing: none            # initialize + tools/list are anonymous
  invocation: required
  headers:
    - name: Authorization
      form: Bearer <RapidAPI key>
    - name: X-Api-Key
      form: raw key, no Bearer prefix
  key_source: https://rapidapi.com/info-8KZIhinZ9/api/cyclecalcs-astronomy-api3
  free_tier: Basic plan is free
  refusal_behavior: >-
    A tool call without a key is refused as a normal tool result carrying
    instructions, not as an HTTP 401 that would drop the connection.
  notes: >-
    Cannot currently be added to ChatGPT connectors, which authenticate with
    OAuth or not at all. The OpenAI Responses API can attach it today by
    passing the key in the mcp tool's `authorization` field.
clients:
  - name: Claude Code
    install: >-
      claude mcp add --transport http cyclecalcs https://www.cyclecalcs.com/mcp
      --header "Authorization: Bearer YOUR_KEY"
  - name: Claude web/desktop
    install: Custom connector with the server URL and an Authorization header
