description: >-
  Four tiers. Basic is free, keyless and permanent — "most integrations live
  on the free tier indefinitely; that is the design, not a trial." The three
  paid rungs sell monthly volume through the RapidAPI marketplace, which
  issues and bills the key. Every tier serves all 29 endpoints at full
  precision and returns the same answer to the last digit; money buys request
  volume and how much sky a single request may ask for, and nothing else.
