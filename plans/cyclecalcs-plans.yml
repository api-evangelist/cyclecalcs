identical_on_every_tier:
  - All 29 endpoints
  - Every field, full precision
  - The same answer, to the last digit
  - JSON, CSV and TXT
  - RFC 9457 error documents
  - RateLimit headers on every response
  - CDN cache hits, which cost nothing
  - The MCP server
range_caps_note: >-
  Ultra and Mega carry the same per-request range caps, so above Ultra the
  purchase is volume, not reach. Full cap table in
  rate-limits/cyclecalcs-rate-limits.yml and live at /v2/conventions as
  range_caps_by_shape.
