name: CycleCalcs
description: >-
  CycleCalcs publishes a read-only positional-astronomy engine as both a REST API and a hosted MCP server over the
  same core: sun and moon rise/set and twilight, moon phases and libration, planet positions and a visibility board,
  eclipses with per-observer local circumstances, seasons, apsides, lunar nodes, retrograde stations, conjunctions and
  angular separation, sidereal time, the equation of time, Jupiter's Galilean moons, sky quality and dark-sky windows,
  place lookup, and a one-call whole-sky snapshot. It returns the named answer and the numbers behind it rather than
  raw ephemeris, and every response states its frame, epoch, time scale and refraction model. Computed live with the
  MIT-licensed Astronomy Engine, arcminute class for the Sun, Moon and planets from 1700 to 2200. Twenty-nine GET
  endpoints, JSON/CSV/TXT, RFC 9457 problem documents, open CORS, and a free tier that needs no key, no signup and no
  card; paid volume tiers sell through RapidAPI. Pure astronomy — no astrology and no claims that sky events affect
  people or Earth.
image: https://www.cyclecalcs.com/assets/og-card.png?v=2
